<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nTitlebar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a2a8f"/>
      <stop offset="100%" stop-color="#1e8fe0"/>
    </linearGradient>
    <linearGradient id="nBtnFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f4"/>
      <stop offset="100%" stop-color="#c7c7c7"/>
    </linearGradient>
    <filter id="nShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#nShadow)">
    <rect x="8" y="8" width="984" height="284" rx="9" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.5"/>

    <path d="M8 17 a9 9 0 0 1 9 -9 h966 a9 9 0 0 1 9 9 v30 h-984 z" fill="url(#nTitlebar)"/>
    <g transform="translate(26,24)">
      <rect x="-6" y="-9" width="14" height="17" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
      <line x1="-3.6" y1="-5" x2="5.6" y2="-5" stroke="#1f2937" stroke-width="0.9"/>
      <line x1="-3.6" y1="-2" x2="5.6" y2="-2" stroke="#1f2937" stroke-width="0.9"/>
      <line x1="-3.6" y1="1" x2="5.6" y2="1" stroke="#1f2937" stroke-width="0.9"/>
    </g>
    <text x="48" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#ffffff">about_me.txt - Notepad</text>

    <g transform="translate(900,13)" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">
      <g><rect width="22" height="20" rx="2" fill="url(#nBtnFace)" stroke="#6b7280"/><text x="11" y="14" text-anchor="middle" fill="#1f2937">_</text></g>
      <g transform="translate(26,0)"><rect width="22" height="20" rx="2" fill="url(#nBtnFace)" stroke="#6b7280"/><rect x="6" y="5" width="10" height="9" fill="none" stroke="#1f2937" stroke-width="1.3"/></g>
      <g transform="translate(52,0)"><rect width="22" height="20" rx="2" fill="url(#nBtnFace)" stroke="#6b7280"/><text x="11" y="14" text-anchor="middle" fill="#7f1d1d">x</text></g>
    </g>

    <text x="26" y="62" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#374151">File   Edit   Format   View   Help</text>
    <line x1="8" y1="71" x2="992" y2="71" stroke="#d6d9e0"/>

    <g font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#1f2937">
      <text x="26" y="100">Hi, I'm Jayadeep. I make robots that don't fall over (mostly)</text>
      <text x="26" y="128">and language models that fit on a credit-card-sized computer.</text>
      <text x="26" y="156"><tspan fill="#9ca3af">// </tspan>final-year Robotics &amp; AI, BIT Bangalore. Researching at IISc.</text>
      <text x="26" y="184"><tspan fill="#9ca3af">// </tspan>I debug hardware by staring at it until it feels guilty.</text>
      <text x="26" y="212">Currently: open to robotics / embedded-AI research roles.</text>
      <text x="26" y="240">Always: three coffees deep into a kinematics problem.</text>
    </g>
    <rect x="645" y="228" width="9" height="16" fill="#1f2937">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>

    <line x1="8" y1="266" x2="992" y2="266" stroke="#d6d9e0"/>
    <text x="24" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="11.5" fill="#6b7280">Ln 6, Col 42   100%   Windows (CRLF)   UTF-8</text>
  </g>
</svg>
