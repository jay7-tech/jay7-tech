name: Live profile telemetry

# Regenerates the "live" images referenced in README.md (assets/github-languages.svg and
# assets/github-snake.svg) on a schedule, via GitHub's own Actions runners, and commits
# them straight back into this repo. Nothing in the README depends on a third-party
# uptime at *view* time, since the images are just files in this repo, refreshed every
# few hours.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # lets you trigger a refresh manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: assets/github-languages.svg
          committer_message: "chore: refresh language breakdown [skip ci]"
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 10
          plugin_languages_threshold: "0%"
          plugin_languages_details: "lines, percentage"
          plugin_languages_colors: github
          theme: github-dark

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: platane/snk@v3
        id: snake
        with:
          github_user_name: jay7-tech
          outputs: |
            assets/github-snake.svg?palette=github-dark
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution snake [skip ci]"
          file_pattern: assets/github-snake.svg
