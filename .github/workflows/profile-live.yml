name: Live profile telemetry

# Regenerates the two "live" images referenced in README.md (assets/github-metrics.svg
# and assets/github-snake.svg) on a schedule, via GitHub's own Actions runners, and
# commits them straight back into this repo. Nothing in the README depends on a
# third-party uptime at *view* time — the images are just files in this repo, refreshed
# every few hours. If this workflow is ever disabled, the last-generated images simply
# stop updating; they never go blank or 404.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # lets you trigger a refresh manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # A classic PAT with the `repo` scope, saved as a repo secret named
          # METRICS_TOKEN (Settings → Secrets and variables → Actions → New repository
          # secret). The default GITHUB_TOKEN also works for the basic plugins below;
          # swap to METRICS_TOKEN only if you enable a plugin that needs broader read
          # access (e.g. private contributions).
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: assets/github-metrics.svg
          committer_message: "chore: refresh live metrics [skip ci]"
          base: "header, activity"
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: "0%"
          plugin_languages_details: "lines, percentage"
          theme: github-dark

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: platane/snk@v3
        id: snake
        with:
          github_user_name: jay7-tech
          outputs: |
            assets/github-snake.svg?palette=github-dark
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution snake [skip ci]"
          file_pattern: assets/github-snake.svg
